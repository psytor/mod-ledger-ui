server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # All requests for mod-ledger-ui come prefixed with /mod-ledger/
    # We need to strip this prefix to serve files from /usr/share/nginx/html
    location /mod-ledger/ {
        rewrite ^/mod-ledger/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Serve static assets with appropriate caching and MIME types for direct asset access (e.g., /assets/...)
    # This location block now sits outside the /mod-ledger/ block and will be evaluated first for direct asset requests.
    location ~* \.(?:css|js|map|jpe?g|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Catch-all for anything not matched above, usually for the main SPA index.html
    location / {
        # In this specific setup, the primary entry point is /mod-ledger/, so / should not be directly hit.
        # However, it's good practice to have a fallback.
        try_files $uri $uri/ =404; # Or redirect to /mod-ledger/ if / is not expected to serve anything directly.
    }
}