name: mod-ledger-ui

services:
  mod-ledger-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Vite inlines these at build time; passed through from .env at the repo root.
        VITE_MOD_LEDGER_URL: ${VITE_MOD_LEDGER_URL}
        VITE_ASTROGATORS_TABLE_URL: ${VITE_ASTROGATORS_TABLE_URL}
    image: mod-ledger-ui:latest
    container_name: mod-ledger-ui
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4174/mod-ledger/"]
      interval: 30s
      timeout: 5s
      retries: 3
